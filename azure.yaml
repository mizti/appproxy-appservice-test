# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: appproxy-appservice-test
metadata:
  template: appproxy-appservice-test@0.0.1
services:
  web:
    project: ./app
    language: python
    host: appservice
hooks:
  preprovision:
    shell: sh
    run: ./scripts/preprovision.sh
    continueOnError: false
    interactive: true
  postprovision:
    shell: sh
    run: ./scripts/postprovision.sh
    continueOnError: false
    interactive: true
